# configs/model_config.yaml

# ── Classifier (Phase 1) ──────────────────────────────────────────
classifier:
  model_name: "xlm-roberta-large"
  num_labels: 3                        # SUPPORTS / REFUTES / NEI
  max_length: 256
  batch_size: 16
  learning_rate: 2e-5
  num_epochs: 5
  warmup_ratio: 0.1
  weight_decay: 0.01
  output_dir: "models/checkpoints/classifier"
  fp16: true
  gradient_accumulation_steps: 2

# ── NLI Model (Phase 3) ──────────────────────────────────────────
nli:
  model_name: "microsoft/mdeberta-v3-base"
  num_labels: 3
  max_length: 512
  batch_size: 8
  learning_rate: 1e-5
  num_epochs: 4
  warmup_ratio: 0.06
  weight_decay: 0.01
  output_dir: "models/checkpoints/nli"
  fp16: true
  gradient_accumulation_steps: 4

# ── Dense Retriever ───────────────────────────────────────────────
retriever:
  encoder_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  index_path: "data/index/wiki_multilingual.faiss"
  corpus_path: "data/processed/wiki_corpus.jsonl"
  top_k: 10
  embedding_dim: 384

# ── Datasets ──────────────────────────────────────────────────────
datasets:
  liar:
    path: "data/raw/liar"
    url: "https://www.cs.ucsb.edu/~william/data/liar_dataset.zip"
  factify:
    path: "data/raw/factify"
  custom_indian:
    path: "data/raw/indian_fc"

# ── Training ──────────────────────────────────────────────────────
training:
  seed: 42
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "macro_f1"
  logging_steps: 50

# ── Languages ─────────────────────────────────────────────────────
languages:
  supported: ["en", "hi", "ta", "bn"]
  hinglish_detect_threshold: 0.3
